services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bus_booking
      POSTGRES_USER: bus_app
      POSTGRES_PASSWORD: bus_app_secret
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus_app -d bus_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: